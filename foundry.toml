[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
ffi = false
memory_limit = 1073741824
allow_internal_expect_revert = true
fs_permissions = [
  { access = "read", path = "./deployments" },
  { access = "read-write", path = "./test/vectors" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "v4-core-test/=lib/v4-core/test/",
  "@forshtat/hegota-support/=lib/hegota-support/",
  "hegota-support/=lib/hegota-support/contracts/",
]

# Pinned dependency commits (also recorded in deployments/pins.json):
#   forge-std  dc647cc030d9d65910d8f1172a0cde48d7106e32
#   v4-core    bea7f6d1c11cd5dc4f0d5151ffa37a1c239feee6

[profile.default.fuzz]
runs = 10000
seed = "0xa070"

[profile.default.invariant]
runs = 1000
depth = 200
fail_on_revert = false

# `just fuzz-deep`
[profile.deep.fuzz]
runs = 100000

[profile.deep.invariant]
runs = 2000
depth = 400

# fast local iteration: `FOUNDRY_PROFILE=quick forge test`
[profile.quick.fuzz]
runs = 256

[profile.quick.invariant]
runs = 32
depth = 64

[lint]
lint_on_build = false
